id: margaret_chen_happy_path
description: >
  The brief's worked example, verbatim: identity + case hint in one
  utterance, verified, hint replayed after verification, grounded
  PROCESS_CASE answers, then a consent-gated summary email.
tags: [core, happy_path]
turns:
  - user: >
      I'm the policyholder. My name is Margaret Chen, policy POL-9921. I'm
      calling about my denied healthcare claim from January. DOB is
      1985-03-15, SSN last four is 4472.
    expect_phase: RESOLVE_INTENT
  - user: "Yes, that's the one."
    expect_phase: PROCESS_CASE
  - user: "Why was it denied, and what do I need to do?"
    expect_phase: PROCESS_CASE
  - user: "OK, no more questions, thanks."
    expect_phase: POST_PROCESS
  - user: "Yes please, send it to my email."
    # CHANGED from POST_PROCESS, deliberately, and worth saying why: the
    # caller already said "no more questions, thanks" on the previous turn.
    # The old expectation encoded the behaviour a live tester complained
    # about — the agent sending the summary and then leaving them sitting in
    # an open conversation, waiting to be asked a second time whether they
    # needed anything. With the wrap-up intent sticky (DESIGN.md §7.15) the
    # agent sends and closes in the same turn, so CLOSED is now the correct
    # assertion. This is a test updated to match an intended behaviour
    # change, not a test relaxed to accommodate a regression.
    expect_phase: CLOSED
final:
  phase: CLOSED
  verified_party_id: P9
  confirmed_case_id: CL-2048
  email_sent: true
